name: Deploy to GitHub Pages

# Publishes the static export to the gh-pages branch. Creating/updating a
# gh-pages branch enables branch-based GitHub Pages automatically, which
# avoids needing the Pages admin API (not available to the workflow token
# in all environments).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          BASE_PATH: /england-made-fluent
          NEXT_PUBLIC_SITE_URL: https://oaksprout.github.io/england-made-fluent
        run: pnpm build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          commit_message: "Deploy ${{ github.sha }}"
